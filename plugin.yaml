name: hermes-wechat-enhance
version: 3.1.0
manifest_version: 1
api_version: 1
description: Reliable Weixin delivery, durable FIFO resume, acknowledged text/media bubble counters, model tags, audit, and migration support.
author: Awenforever
license: MIT
homepage: https://github.com/Awenforever/hermes-wechat-enhance
tags: [gateway, weixin, operations, audit]
requires_hermes: ">=0.21.3,<0.22"
config_schema:
  capture_messages:
    type: bool
    default: true
    description: Store a bounded local audit copy of inbound and outbound messages.
  startup_notification:
    type: bool
    default: true
    description: Send an explicit ready notice after gateway startup.
  startup_message:
    type: str
    default: "♻️ Gateway online — Hermes is back and ready."
    description: Optional custom text for the startup-ready notification.
